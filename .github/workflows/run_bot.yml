name: Automated Movie Recap Short Bot

on:
  schedule:
    # Runs daily at 10:00 AM UTC (Adjust time as needed)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download movies from Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p input
          # Downloads files from the shared Google Drive folder into input/
          python -c "import gdown, os; gdown.download_folder(id=os.environ['GDRIVE_FOLDER_ID'], output='input', quiet=False, use_cookies=False)"

      - name: Run main.py script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Commit updated database state back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add database.db
          git commit -m "Auto-update database progress [skip ci]" || echo "No state changes to commit"
          git push
